# Read by the component pipeline's SonarCloud step (krizaka/orazaka component.yml, `sonar: true`), run from this repository's
# folder after `mvn verify`: the compiled classes and the JaCoCo reports (krizaka-parent binds jacoco:report to verify) are in target/.
sonar.projectKey=krizaka_orazaka-ai-engine
sonar.organization=krizaka
sonar.sources=.
sonar.exclusions=scratch/**,**/node_modules/**,**/target/**,**/src/test/**,docs/**,infra/**
sonar.tests=.
sonar.test.inclusions=**/src/test/**
sonar.java.source=21
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/entity/**,**/converter/**,**/config/**,**/domain/model/**,**/*Application.java,**/Mapper.java,**/*Mapper.java,**/*Controller.java,**/core/infrastructure/**
