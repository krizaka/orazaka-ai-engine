# Builds and tests sovkora-engine inside the Sovkora workspace (every upstream repository is
# built from source at its default branch), then publishes to GitHub Packages on a v* tag.
# The pipeline itself lives in krizaka/sovkora so every repository is checked the same way.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  component:
    permissions:
      contents: read
      packages: write
      # The shared component pipeline publishes npm packages with provenance (OIDC): a reusable
      # workflow cannot be granted more than its caller holds, so its absence fails at startup.
      id-token: write
    uses: krizaka/sovkora/.github/workflows/component.yml@d6d02634972b6cc0706c04e7b8f26ab96bddb46d # main (the required SonarCloud check when verify skips)
    with:
      component: orazaka-ai-engine
      duplication: true
      rewrite: true
      sonar: true            # CI analysis with the verification's JaCoCo reports (krizaka/.github#377); automatic analysis is switched off
    secrets: inherit # zizmor: ignore[secrets-inherit] the org's own pinned pipeline; it reads SONAR_TOKEN and nothing else of the repository's secrets
