# Dependabot: the Krizaka model (monthly, ONE grouped pull request per ecosystem; krizaka/.github#510 cap of 3 open PRs).
# `all` takes every update, majors and workflow pins included, so a run never opens a PR per dependency.
# Security fixes stay on and arrive grouped apart. Auto-merge is the shared workflow of krizaka/.github (minor and patch, CI green).
# The ignore rules below are decisions, not oversights.
version: 2
updates:

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    ignore:
      # Anthropic Java SDK 3.x is binary-incompatible with Spring AI 2.0.2 (spring-ai-anthropic calls
      # ClientOptions.Builder.backend(Backend), gone in 3.x: NoSuchMethodError, #222). Every Spring AI
      # release on Maven Central (2.0.2, 2.1.0-RC1) still builds on anthropic-java 2.72.0.
      # Drop this rule in the same PR that moves spring-ai.version (sovkora-build) to the first Spring AI
      # release whose spring-ai-anthropic depends on anthropic-java 3.x; minor and patch 2.x updates still flow.
      - dependency-name: "com.anthropic:*"
        update-types: ["version-update:semver-major"]
